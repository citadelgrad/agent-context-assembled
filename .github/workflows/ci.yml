name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -v ./...

      - name: Vet
        run: go vet ./...

      - name: gofmt check
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt'd:"
            echo "$fmt_out"
            exit 1
          fi

      - name: Verify fuzz matrix coverage
        run: python3 scripts/check-fuzz-matrix.py

      - name: Test
        run: go test -race ./...

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: ./cmd/actx
            target: FuzzWantsJSONLastRecognizedOccurrenceWins
          - package: ./cmd/actx
            target: FuzzFilterResultsAndReportsPreserveOrder
          - package: ./internal/compile
            target: FuzzFrontmatterAndRuleConditionsNeverPanic
          - package: ./internal/compile
            target: FuzzFrontmatterFieldMetamorphic
          - package: ./internal/compile
            target: FuzzCompileLosslessOrderedTransformation
          - package: ./internal/inspect
            target: FuzzReadCodexRolloutStateMachine
          - package: ./internal/render
            target: FuzzJSONRenderingProjectionAndFiltering
          - package: ./internal/render
            target: FuzzCompileAndInspectJSONRoundTrip
          - package: ./internal/scan
            target: FuzzExpandCandidateFilesystemInvariants
          - package: ./internal/scan
            target: FuzzExpandCandidateArbitraryBoundedPatternNeverPanics
          - package: ./internal/scan
            target: FuzzScopedDirsModel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run bounded fuzz target
        env:
          EVENT_NAME: ${{ github.event_name }}
          PACKAGE: ${{ matrix.package }}
          TARGET: ${{ matrix.target }}
        run: |
          fuzz_time=10s
          parallel=4
          if [ "$EVENT_NAME" = schedule ]; then
            fuzz_time=2m
          fi
          # Filesystem fuzz cases create and clean temporary trees per input. Running
          # them serially avoids workers still cleaning up at the fuzz deadline.
          if [ "$TARGET" = FuzzExpandCandidateFilesystemInvariants ]; then
            parallel=1
          fi
          go test "$PACKAGE" -run '^$' -fuzz "^${TARGET}$" -fuzztime "$fuzz_time" -parallel "$parallel"

<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">actx assembles the instruction context each AI coding agent actually sees</title>
  <desc id="desc">A terminal-style diagram showing scattered instruction files entering actx and becoming accurate, ordered context views for Claude Code, Codex CLI, Cursor, and other coding agents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#121a2f"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#59d8ff" stop-opacity=".05"/>
      <stop offset=".5" stop-color="#59d8ff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#9c7cff" stop-opacity=".08"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".35"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .sans { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .muted { fill: #94a3b8; }
      .line { stroke: #34435f; stroke-width: 2; }
      .code { fill: #8fa3c0; font-size: 15px; }
    </style>
  </defs>

  <rect width="1440" height="820" rx="28" fill="url(#bg)"/>
  <circle cx="120" cy="40" r="230" fill="#2763ff" opacity=".08"/>
  <circle cx="1320" cy="760" r="250" fill="#9c7cff" opacity=".08"/>

  <text x="720" y="70" text-anchor="middle" class="sans" fill="#f8fafc" font-size="34" font-weight="750">Every agent sees a different context.</text>
  <text x="720" y="108" text-anchor="middle" class="sans muted" font-size="19">actx shows the files, order, and effective instructions — before the agent starts.</text>

  <!-- Terminal frame -->
  <g filter="url(#shadow)">
    <rect x="70" y="150" width="1300" height="585" rx="18" fill="#0a0f1c" stroke="#2d3a55" stroke-width="2"/>
    <path d="M70 198h1300" class="line"/>
    <circle cx="102" cy="174" r="7" fill="#ff6b6b"/>
    <circle cx="126" cy="174" r="7" fill="#ffd166"/>
    <circle cx="150" cy="174" r="7" fill="#4ade80"/>
    <text x="720" y="181" text-anchor="middle" class="mono muted" font-size="14">~/projects/your-repo — actx</text>
  </g>

  <!-- Inputs -->
  <text x="115" y="242" class="sans" fill="#dbeafe" font-size="15" font-weight="700" letter-spacing="2">SCATTERED RULES</text>
  <text x="115" y="269" class="sans muted" font-size="14">global · workspace · repo · path</text>

  <g class="mono" font-size="17">
    <g transform="translate(110 302)">
      <rect width="330" height="58" rx="10" fill="#101a2d" stroke="#2f496b"/>
      <rect width="5" height="58" rx="3" fill="#59d8ff"/>
      <text x="24" y="25" fill="#e0f2fe">~/.claude/CLAUDE.md</text>
      <text x="24" y="46" class="code">user preferences</text>
    </g>
    <g transform="translate(110 374)">
      <rect width="330" height="58" rx="10" fill="#101a2d" stroke="#2f496b"/>
      <rect width="5" height="58" rx="3" fill="#a78bfa"/>
      <text x="24" y="25" fill="#ede9fe">~/projects/AGENTS.md</text>
      <text x="24" y="46" class="code">workspace policy</text>
    </g>
    <g transform="translate(110 446)">
      <rect width="330" height="58" rx="10" fill="#101a2d" stroke="#2f496b"/>
      <rect width="5" height="58" rx="3" fill="#fbbf24"/>
      <text x="24" y="25" fill="#fef3c7">./CLAUDE.md</text>
      <text x="24" y="46" class="code">repository rules</text>
    </g>
    <g transform="translate(110 518)">
      <rect width="330" height="58" rx="10" fill="#101a2d" stroke="#2f496b"/>
      <rect width="5" height="58" rx="3" fill="#fb7185"/>
      <text x="24" y="25" fill="#ffe4e6">.cursor/rules/*.mdc</text>
      <text x="24" y="46" class="code">path-scoped rules</text>
    </g>
    <g transform="translate(110 590)">
      <rect width="330" height="58" rx="10" fill="#101a2d" stroke="#2f496b"/>
      <rect width="5" height="58" rx="3" fill="#4ade80"/>
      <text x="24" y="25" fill="#dcfce7">.github/instructions/</text>
      <text x="24" y="46" class="code">tool-specific rules</text>
    </g>
  </g>

  <!-- Flow -->
  <path d="M455 475 C510 475 518 475 560 475" stroke="url(#beam)" stroke-width="84" fill="none"/>
  <path d="M455 475h98" stroke="#59d8ff" stroke-width="3" stroke-linecap="round"/>
  <path d="M544 467l12 8-12 8" fill="none" stroke="#59d8ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- actx core -->
  <g transform="translate(565 345)" filter="url(#glow)">
    <rect width="245" height="260" rx="24" fill="#101a31" stroke="#59d8ff" stroke-width="2"/>
    <rect x="20" y="20" width="205" height="44" rx="9" fill="#07101e" stroke="#2b5674"/>
    <text x="34" y="48" class="mono" fill="#76e4ff" font-size="20">$ actx --compile</text>
    <text x="122" y="113" text-anchor="middle" class="sans" fill="#fff" font-size="38" font-weight="800">actx</text>
    <text x="122" y="143" text-anchor="middle" class="sans muted" font-size="15">models each tool’s real rules</text>
    <g class="sans" font-size="15" fill="#cbd5e1">
      <circle cx="37" cy="180" r="4" fill="#59d8ff"/><text x="51" y="185">discovery scope</text>
      <circle cx="37" cy="211" r="4" fill="#59d8ff"/><text x="51" y="216">precedence order</text>
      <circle cx="37" cy="242" r="4" fill="#59d8ff"/><text x="51" y="247">merge semantics</text>
    </g>
  </g>

  <path d="M824 475 C870 475 875 475 912 475" stroke="url(#beam)" stroke-width="84" fill="none"/>
  <path d="M824 475h78" stroke="#a78bfa" stroke-width="3" stroke-linecap="round"/>
  <path d="M894 467l12 8-12 8" fill="none" stroke="#a78bfa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Outputs -->
  <text x="930" y="242" class="sans" fill="#ede9fe" font-size="15" font-weight="700" letter-spacing="2">WHAT EACH AGENT SEES</text>
  <text x="930" y="269" class="sans muted" font-size="14">ordered · explained · inspectable</text>

  <g transform="translate(925 302)">
    <rect width="390" height="101" rx="12" fill="#11192c" stroke="#355070"/>
    <text x="20" y="29" class="sans" fill="#f8fafc" font-size="17" font-weight="700">Claude Code</text>
    <text x="366" y="29" text-anchor="end" class="mono" fill="#4ade80" font-size="13">3 files</text>
    <path d="M20 43h350" stroke="#293852"/>
    <text x="20" y="66" class="mono code">global → workspace → repository</text>
    <text x="20" y="88" class="mono" fill="#6ee7b7" font-size="14">✓ additive · filesystem-root walk</text>
  </g>

  <g transform="translate(925 417)">
    <rect width="390" height="101" rx="12" fill="#11192c" stroke="#355070"/>
    <text x="20" y="29" class="sans" fill="#f8fafc" font-size="17" font-weight="700">Codex CLI</text>
    <text x="366" y="29" text-anchor="end" class="mono" fill="#4ade80" font-size="13">2 files</text>
    <path d="M20 43h350" stroke="#293852"/>
    <text x="20" y="66" class="mono code">global → repository</text>
    <text x="20" y="88" class="mono" fill="#6ee7b7" font-size="14">✓ additive · stops at git root</text>
  </g>

  <g transform="translate(925 532)">
    <rect width="390" height="116" rx="12" fill="#11192c" stroke="#68579a"/>
    <text x="20" y="29" class="sans" fill="#f8fafc" font-size="17" font-weight="700">Cursor · Copilot · 6 more</text>
    <text x="366" y="29" text-anchor="end" class="mono" fill="#a78bfa" font-size="13">different</text>
    <path d="M20 43h350" stroke="#293852"/>
    <text x="20" y="67" class="mono code">path scopes · nearest wins · conditions</text>
    <text x="20" y="91" class="mono" fill="#c4b5fd" font-size="14">✓ no generic “find every file” guess</text>
  </g>

  <rect x="382" y="680" width="676" height="34" rx="17" fill="#17243a" stroke="#2e4564"/>
  <text x="720" y="703" text-anchor="middle" class="sans" fill="#dbeafe" font-size="15" font-weight="650">Know the context before you trust the answer.</text>
</svg>
